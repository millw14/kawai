[package]
name = "kawai-rpc"
version = "0.1.0"
edition = "2021"
description = "Native Windows RPC client for Solana"
license = "MIT"
repository = "https://github.com/millw14/kawai"

[dependencies]
solana-client = "1.18"
solana-sdk = "1.18"
solana-transaction-status = "1.18"
tokio = { version = "1.36", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
reqwest = { version = "0.11", features = ["json"] }

[features]
default = []
full = ["websocket"]
websocket = []

