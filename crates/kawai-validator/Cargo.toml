[package]
name = "kawai-validator"
version = "0.1.0"
edition = "2021"
description = "Native Windows local Solana validator - No WSL required"
license = "MIT"
repository = "https://github.com/millw14/kawai"

[dependencies]
tokio = { version = "1.36", features = ["full", "process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
reqwest = { version = "0.11", features = ["json"] }
tempfile = "3.10"
dirs = "5.0"
zip = "0.6"
flate2 = "1.0"
tar = "0.4"
indicatif = "0.17"
which = "6.0"

# For process management on Windows
[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_Security",
] }

[features]
default = []
docker = []  # Use Docker backend
native = []  # Native Windows port (future)

