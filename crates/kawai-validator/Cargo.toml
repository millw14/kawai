[package]
name = "kawai-validator"
version = "0.1.0"
edition = "2021"
description = "Native Windows local Solana validator - No WSL, No Docker, Just Windows"
license = "MIT"
repository = "https://github.com/millw14/kawai"

[dependencies]
# Async runtime
tokio = { version = "1.36", features = ["full", "process", "signal"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Web server
warp = "0.3"

# HTTP client (for external calls if needed)
reqwest = { version = "0.11", features = ["json"] }

# Error handling
thiserror = "1.0"

# Logging
tracing = "0.1"

# Utilities
dirs = "5.0"
rand = "0.8"
bs58 = "0.5"
sha2 = "0.10"
base64 = { package = "base64", version = "0.21" }

# Progress bars (for CLI)
indicatif = "0.17"

# File handling
tempfile = "3.10"

# Process management (optional - for fallback to external tools)
which = "6.0"

# For process management on Windows
[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_Security",
] }

[features]
default = ["native"]
native = []     # Native Windows validator (default)
docker = []     # Fallback to Docker if needed
wsl = []        # Fallback to WSL if needed

[dev-dependencies]
tokio-test = "0.4"
