[package]
name = "kawai-build"
version = "0.1.0"
edition = "2021"
description = "Solana program compiler for Windows - No WSL required"
license = "MIT"
repository = "https://github.com/millw14/kawai"

[dependencies]
tokio = { version = "1.36", features = ["full", "process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
reqwest = { version = "0.11", features = ["json", "multipart", "stream"] }
tempfile = "3.10"
dirs = "5.0"
which = "6.0"
indicatif = "0.17"
walkdir = "2.4"
toml = "0.8"
sha2 = "0.10"
hex = "0.4"

[features]
default = []
docker = []   # Docker-based compilation
cloud = []    # Cloud compilation service
local = []    # Local toolchain

