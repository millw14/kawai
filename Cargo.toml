[workspace]
resolver = "2"
members = [
    "apps/cli",
    "crates/kawai-sdk",
    "crates/kawai-wallet",
    "crates/kawai-rpc",
]

# Root package - the original monitor
[package]
name = "kawai"
version = "0.2.0"
edition = "2021"
description = "Native Windows Solana Development Kit - No WSL Required"
license = "MIT"
repository = "https://github.com/millw14/kawai"
keywords = ["solana", "blockchain", "windows", "native", "cryptocurrency"]
categories = ["development-tools", "cryptography::cryptocurrencies"]

[dependencies]
# Solana core (using 1.18 for broader compatibility)
solana-client = "1.18"
solana-sdk = "1.18"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
bs58 = "0.5"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Desktop notifications
notify-rust = "4"

# CSV logging
csv = "1.3"

# Kawai SDK (local)
# kawai-sdk = { path = "crates/kawai-sdk" }

[[bin]]
name = "kawai"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true
